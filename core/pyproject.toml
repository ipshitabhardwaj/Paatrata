[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paatrata-core"
version = "0.1.0"
description = "Compile scheme documents into cited, tested eligibility rules"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "rapidfuzz>=3.0",
    "pdfplumber>=0.11",
    "google-genai>=1.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
eval = ["scikit-learn>=1.4"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
paatrata = "paatrata_core.cli:main"
